kind = "web"
previewPath = "/"
title = "ProfileBizz"
version = "1.0.0"
id = "artifacts/profilebizz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20748

[services.development]
run = "pnpm --filter @workspace/profilebizz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/profilebizz", "run", "build" ]
serve = "static"
publicDir = "artifacts/profilebizz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20748"
BASE_PATH = "/"
