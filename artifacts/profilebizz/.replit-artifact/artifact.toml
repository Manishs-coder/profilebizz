kind = "web"
previewPath = "/"
title = "ProfileBizz"
version = "1.0.0"
id = "artifacts/profilebizz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20748

[services.development]
run = "pnpm --filter @workspace/profilebizz run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/profilebizz", "run", "build"]

[services.production.run]
args = ["node", "artifacts/profilebizz/server.mjs"]

[services.production.run.env]
PORT = "20748"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "20748"
BASE_PATH = "/"
