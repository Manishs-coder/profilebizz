<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- ── Primary SEO ── -->
    <title>ProfileBizz — India's Premier Business &amp; Startup Magazine</title>
    <meta name="description" content="ProfileBizz is India's leading digital magazine for in-depth founder profiles, brand stories, industry analysis, social impact, and business success stories. Covering India's most inspiring entrepreneurs and companies." />
    <meta name="keywords" content="Indian founders, startup stories India, brand stories India, industry analysis India, entrepreneur profiles, business magazine India, MSME success, social impact India, ProfileBizz" />
    <meta name="author" content="ProfileBizz" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://profilebizz.com/" />

    <!-- ── Open Graph / Facebook ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://profilebizz.com/" />
    <meta property="og:site_name" content="ProfileBizz" />
    <meta property="og:title" content="ProfileBizz — India's Premier Business &amp; Startup Magazine" />
    <meta property="og:description" content="In-depth founder profiles, brand stories, industry analysis, and business success stories from India's most inspiring entrepreneurs and companies." />
    <meta property="og:image" content="https://profilebizz.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@profilebizz" />
    <meta name="twitter:title" content="ProfileBizz — India's Premier Business &amp; Startup Magazine" />
    <meta name="twitter:description" content="In-depth founder profiles, brand stories, industry analysis, and business success stories from India." />
    <meta name="twitter:image" content="https://profilebizz.com/og-cover.jpg" />

    <!-- ── Structured Data (JSON-LD) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://profilebizz.com/#website",
          "url": "https://profilebizz.com/",
          "name": "ProfileBizz",
          "description": "India's premier business story platform — founder profiles, brand histories, industry analyses, and MSME spotlights",
          "inLanguage": ["en-IN", "hi-IN"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://profilebizz.com/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "NewsMediaOrganization",
          "@id": "https://profilebizz.com/#organization",
          "name": "ProfileBizz",
          "url": "https://profilebizz.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://profilebizz.com/favicon.svg",
            "width": 512,
            "height": 512
          },
          "description": "India's leading digital magazine covering founder profiles, brand stories, industry analyses, and business success stories from India's most inspiring entrepreneurs and companies.",
          "foundingDate": "2024",
          "areaServed": "IN",
          "sameAs": [
            "https://twitter.com/profilebizz",
            "https://linkedin.com/company/profilebizz"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "IN",
            "addressLocality": "Mumbai"
          },
          "publishingPrinciples": "https://profilebizz.com/",
          "masthead": "https://profilebizz.com/"
        }
      ]
    }
    </script>


    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Barlow+Condensed:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ── Sitemap ── -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
