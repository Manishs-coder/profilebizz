kind = "mobile"
previewPath = "/admin-mobile/"
title = "ProfileBizz Admin Mobile"
version = "1.0.0"
id = "artifacts/admin-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/admin-mobile/" ]
localPort = 20369

[services.development]
run = "pnpm --filter @workspace/admin-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/admin-mobile", "run", "serve" ]

[services.env]
PORT = "20369"
BASE_PATH = "/admin-mobile/"
